services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cs2_market}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka-API-compatible broker — single binary, no Zookeeper, much lighter
  # than real Kafka for local dev. See plan Section 4 for why Kafka is used
  # at all (fan-in from multiple marketplace ingestion plugins).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: cs2-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # Node isn't installed on the host — this substitutes a container for local
  # Node tooling (plan Section 7/9 step 7). Dev-only: runs `next dev` straight
  # from the mounted source, no production build/Dockerfile here.
  dashboard:
    image: node:22-alpine
    container_name: cs2-dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "3000:3000"
    command: sh -c "npm run dev"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker Desktop provides this natively; harmless to also set explicitly

volumes:
  postgres_data:
  redpanda_data:
